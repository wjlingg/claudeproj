name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.html exists
        run: test -f index.html

      - name: Project constraints
        run: |
          fail=0
          check() {
            if grep -nE "$1" index.html; then
              echo "::error::Forbidden pattern ($2) found in index.html"
              fail=1
            fi
          }
          check 'localStorage|sessionStorage|indexedDB|document\.cookie' 'browser persistence'
          check '!important' '!important in CSS'
          check '\b(alert|confirm)\(' 'alert/confirm dialogs'
          check '<script[^>]*src=|<link[^>]*href="?https?:|@import' 'external resources'
          exit $fail

      - name: Email address only in FORMSUBMIT_ENDPOINT
        run: |
          if grep -nE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' index.html | grep -v 'FORMSUBMIT_ENDPOINT' | grep -v 'YOUR_EMAIL@example.com below'; then
            echo "::error::Email address found outside FORMSUBMIT_ENDPOINT"
            exit 1
          fi

      - name: Inline script parses
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          m = re.search(r'<script>(.*?)</script>', html, re.S)
          open('inline.js', 'w', encoding='utf-8').write(m.group(1))
          PY
          node --check inline.js
